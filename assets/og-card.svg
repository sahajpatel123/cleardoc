<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ClearDoc — Read what you sign. Finally.">
  <title>ClearDoc — Read what you sign. Finally.</title>
  <desc>Brutalist broadsheet social card. ClearDoc turns dense legal, medical, and financial documents into plain English.</desc>

  <!-- Paper background -->
  <rect width="1200" height="630" fill="#EDE7D8"/>

  <!-- Top stripe (ink) with ticker signals -->
  <rect x="0" y="0" width="1200" height="58" fill="#14120E"/>
  <text x="22" y="38" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" font-weight="700" fill="#FF6A3D" letter-spacing="2">
    <tspan>● DOCUMENT DESK</tspan>
    <tspan dx="28" fill="#7fd4c2" font-size="14">PASTE IT · READ IT CLEAR · ASK IT ANYTHING</tspan>
    <tspan dx="28" fill="#FF6A3D" font-size="14">PLAIN ENGLISH + VERDICT + NEXT STEPS</tspan>
  </text>

  <!-- Big wordmark -->
  <text x="60" y="240" font-family="'Archivo Black','Helvetica Neue',sans-serif" font-size="170" font-weight="900" fill="#14120E" letter-spacing="-6">CLEARDOC</text>
  <text x="62" y="248" font-family="'Archivo Black','Helvetica Neue',sans-serif" font-size="170" font-weight="900" fill="#FF3B00" letter-spacing="-6" opacity="0.0">CLEARDOC</text>

  <!-- TM mark -->
  <text x="945" y="170" font-family="'JetBrains Mono',monospace" font-size="20" fill="#D62E00" font-weight="700">™</text>

  <!-- Tagline -->
  <text x="60" y="320" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="42" font-weight="700" fill="#14120E" letter-spacing="-1">Read what you <tspan fill="#FF3B00">sign.</tspan> Finally.</text>

  <!-- Subline -->
  <text x="60" y="370" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="26" font-weight="500" fill="#5A554A">Contracts. Leases. Medical bills. In plain English.</text>

  <!-- Fog → Clear comparison card -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="540" height="160" fill="#FFFFFF" stroke="#14120E" stroke-width="3"/>
    <!-- labels -->
    <text x="14" y="26" font-family="'JetBrains Mono',monospace" font-size="12" fill="#5A554A" letter-spacing="2">YOUR TEXT · ORIGINAL</text>
    <text x="380" y="26" font-family="'JetBrains Mono',monospace" font-size="12" fill="#176B53" letter-spacing="2">CLEARDOC ✦</text>
    <!-- original (italic, foggy) -->
    <text x="20" y="70" font-family="'Fraunces','Georgia',serif" font-style="italic" font-size="22" fill="#7a746a">Lessee shall, notwithstanding</text>
    <text x="20" y="98" font-family="'Fraunces','Georgia',serif" font-style="italic" font-size="22" fill="#7a746a">any provision herein, indemnify</text>
    <text x="20" y="126" font-family="'Fraunces','Georgia',serif" font-style="italic" font-size="22" fill="#7a746a">lessor in perpetuity.</text>
    <!-- divider rule -->
    <line x1="270" y1="48" x2="270" y2="148" stroke="#FF3B00" stroke-width="3"/>
    <!-- plain english -->
    <text x="290" y="70" font-family="'Archivo',sans-serif" font-size="22" font-weight="700" fill="#14120E">You (the renter) must</text>
    <text x="290" y="98" font-family="'Archivo',sans-serif" font-size="22" font-weight="700" fill="#176B53" background-fill="#e6f0ec">cover the landlord's</text>
    <text x="290" y="126" font-family="'Archivo',sans-serif" font-size="22" font-weight="700" fill="#C6361F">losses — forever.</text>
  </g>

  <!-- Right-side stamp / seal -->
  <g transform="translate(820, 420)">
    <rect x="0" y="0" width="320" height="160" fill="#14120E"/>
    <text x="160" y="46" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="3" fill="#7fd4c2">THE SEALED VAULT</text>
    <text x="160" y="92" text-anchor="middle" font-family="'Archivo Black',sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SOLD 0</text>
    <text x="160" y="116" text-anchor="middle" font-family="'Archivo',sans-serif" font-size="14" fill="#EDE7D8">documents. We never will.</text>
    <line x1="40" y1="132" x2="280" y2="132" stroke="#FF3B00" stroke-width="2"/>
    <text x="160" y="150" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#FF6A3D">cleardoc.app</text>
  </g>

  <!-- Bottom rule -->
  <rect x="0" y="608" width="1200" height="22" fill="#FF3B00"/>
  <text x="60" y="624" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FFFFFF" letter-spacing="3">VOL. 0042 · NO SIGNATURE LEFT BEHIND · AUTO-DELETED WITHIN 24H · NEVER TRAINED ON</text>
</svg>
