# Security hardening workflow - runs on every push/pull_request to main
# Combines dependency review, security-focused tests, and best practice checks.

name: "Security checks"
run-name: "Security checks"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  schedule:
    # Weekly security scan on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to run the security suite against'
        required: false
        default: '22'

# Default to read-only access; individual jobs may request the narrow
# additional scopes they need (e.g. dependency-review reads PR metadata).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review - validates that only allowed dependencies are added
  # Prevents adding dependencies with security vulnerabilities or disallowed licenses
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Deny strong copyleft licenses that could cause legal issues
          deny-licenses: "GPL-3.0, AGPL-3.0, GPL-2.0"
          # Warn on weak copyleft licenses
          warn-licenses: "LGPL-2.1, LGPL-3.0, MPL-2.0"

  # Security tests - runs the test suite with security-focused checks
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: npm

      - name: Install dependencies (reproducible from committed lockfile)
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # JSON config validation (vercel.json, site.webmanifest)
      - name: Validate JSON configs
        run: npm run validate:json

      # JavaScript syntax check
      - name: Parse-check all JS
        run: npm run syntax

      # Run security-focused unit tests
      - name: Run security unit tests
        run: npm run test:unit -- --test-name-pattern="(safety|rateLimit|applyRateLimitHeaders|applyAiResponseHeaders|errLog|accessLog|sanitizeLogField|readCappedBody|getIp|json)"

      # Run all tests for completeness
      - name: Run full test suite
        run: npm test
        env:
          CI: 'true'

  # Security lint - pattern-based security checks
  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run consolidated security hardening script
        run: bash scripts/security-hardening.sh

      - name: Check for hardcoded secrets
        run: |
          # Scan for potential hardcoded secrets (not exhaustive, but catches common mistakes)
          # This is a basic check - GitHub also has secret scanning enabled
          if grep -rE "(api[_-]?key|secret[_-]?key|password)\s*=\s*['\"]" --include="*.js" --include="*.ts" . 2>/dev/null | grep -v "node_modules" | grep -v "//"; then
            echo "::error::Potential hardcoded secrets detected"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Ensure no .env secret files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(\.env|\.env\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env files may leak secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked env secret files"

      - name: Verify robots.txt disallows /api/
        run: |
          if ! grep -q "^Disallow: /api/$" robots.txt; then
            echo "::error::robots.txt must disallow /api/"
            exit 1
          fi
          echo "robots.txt disallows /api/"

      - name: Check for eval/Function usage
        run: |
          # Detect dangerous eval/Function usage
          if grep -rE "\b(eval|Function)\s*\(" --include="*.js" . 2>/dev/null | grep -v "node_modules" | grep -v "// "; then
            echo "::error::Potentially dangerous eval/Function usage detected"
            exit 1
          fi
          echo "No dangerous eval/Function usage found"

      - name: Check CSP strictness
        run: |
          # Verify CSP is strict (no unsafe-inline, unsafe-eval in script-src)
          if grep -rE "script-src.*unsafe-(inline|eval)" . --include="*.json" 2>/dev/null; then
            echo "::error::Unsafe CSP directives found"
            exit 1
          fi
          echo "CSP mode looks secure"

      - name: Verify security headers in vercel.json
        run: |
          if [ -f vercel.json ]; then
            if grep -q '"headers"' vercel.json; then
              echo "✓ Security headers defined in vercel.json"
              echo ""
              echo "Headers configured:"
              grep -oE '"[^"]+": "[^"]+"' vercel.json | grep -E "(Strict-Transport-Security|X-Frame-Options|X-Content-Type-Options|Content-Security-Policy)" || echo "  (standard security headers present)"
            else
              echo "::warning::No custom headers defined in vercel.json"
            fi
          else
            echo "::warning::vercel.json not found"
          fi
