# Security hardening workflow - runs on every push/pull_request to main
# Combines dependency review, security-focused tests, and best practice checks.

name: "Security checks"
run-name: "Security checks"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  schedule:
    # Weekly security scan on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to run the security suite against'
        required: false
        default: '22'

# Default to read-only access; individual jobs may request the narrow
# additional scopes they need (e.g. dependency-review reads PR metadata).
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency review - validates that only allowed dependencies are added
  # Prevents adding dependencies with security vulnerabilities or disallowed licenses
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Deny strong copyleft licenses that could cause legal issues
          deny-licenses: "GPL-3.0, AGPL-3.0, GPL-2.0"
          # Warn on weak copyleft licenses
          warn-licenses: "LGPL-2.1, LGPL-3.0, MPL-2.0"

  # Security tests - runs the test suite with security-focused checks
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: npm

      - name: Install dependencies (reproducible from committed lockfile)
        # --ignore-scripts blocks preinstall/install/postinstall lifecycle hooks
        # in dependencies — a common supply-chain attack vector.
        # Safe for this project: the only devDependency (playwright) installs
        # browsers separately via 'npx playwright install', and fsevents
        # (macOS-only, optional) is excluded from Linux CI.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # JSON config validation (vercel.json, site.webmanifest)
      - name: Validate JSON configs
        run: npm run validate:json

      # JavaScript syntax check
      - name: Parse-check all JS
        run: npm run syntax

      # Run security-focused unit tests
      - name: Run security unit tests
        run: npm run test:unit -- --test-name-pattern="(safety|rateLimit|applyRateLimitHeaders|applyAiResponseHeaders|errLog|accessLog|sanitizeLogField|readCappedBody|getIp|json)"

      # Run all tests for completeness
      - name: Run full test suite
        run: npm test
        env:
          CI: 'true'

  # Security lint - pattern-based security checks
  security-lint:
    name: Security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run consolidated security hardening script
        run: bash scripts/security-hardening.sh

      - name: Check for hardcoded secrets
        run: |
          # Scan tracked source/config files only (never local .env files) for
          # hardcoded secrets, private keys, and provider tokens. GitHub secret
          # scanning still runs as a second layer; this is the fail-fast gate.
          if git grep -nE "(api[_-]?key|secret[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|private[_-]?key)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{10,}['\"]|(sk_live_|pk_live_|sk_test_|pk_test_|ghp_|github_pat_|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY)" -- "*.js" "*.ts" "*.mjs" "*.cjs" "*.json" "*.html" "*.css" "*.sh" "*.yml" "*.yaml" ':(exclude)scripts/security-hardening.sh' ':(exclude).github/workflows/security.yml'; then
            echo "::error::Potential hardcoded secrets / private keys / provider tokens detected"
            exit 1
          fi
          echo "No hardcoded secrets found in tracked files"

      - name: Ensure no .env secret files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(\.env|\.env\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env files may leak secrets:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked env secret files"

      - name: Verify robots.txt disallows /api/
        run: |
          if ! grep -q "^Disallow: /api/$" robots.txt; then
            echo "::error::robots.txt must disallow /api/"
            exit 1
          fi
          echo "robots.txt disallows /api/"

      - name: Check for eval/Function usage
        run: |
          # Detect dangerous eval/Function usage
          if grep -rE "\b(eval|Function)\s*\(" --include="*.js" . 2>/dev/null | grep -v "node_modules" | grep -v "// "; then
            echo "::error::Potentially dangerous eval/Function usage detected"
            exit 1
          fi
          echo "No dangerous eval/Function usage found"

      - name: Check CSP strictness
        run: |
          # Verify CSP is strict (no unsafe-inline, unsafe-eval in script-src)
          if grep -rE "script-src.*unsafe-(inline|eval)" . --include="*.json" 2>/dev/null; then
            echo "::error::Unsafe CSP directives found"
            exit 1
          fi
          echo "CSP mode looks secure"

      - name: Verify security headers in vercel.json
        run: |
          if [ -f vercel.json ]; then
            if grep -q '"headers"' vercel.json; then
              echo "✓ Security headers defined in vercel.json"
              echo ""
              echo "Headers configured:"
              grep -oE '"[^"]+": "[^"]+"' vercel.json | grep -E "(Strict-Transport-Security|X-Frame-Options|X-Content-Type-Options|Content-Security-Policy)" || echo "  (standard security headers present)"
            else
              echo "::warning::No custom headers defined in vercel.json"
            fi
          else
            echo "::warning::vercel.json not found"
          fi

  # Supply chain security - detects risky dependency patterns and production vulnerabilities
  supply-chain-security:
    name: Supply chain security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (reproducible from committed lockfile)
        # --ignore-scripts blocks preinstall/install/postinstall lifecycle
        # hooks in dependencies — a common supply-chain attack vector.
        # Safe for this project: the only devDependency (playwright) installs
        # browsers separately via 'npx playwright install', and fsevents
        # (macOS-only, optional) is excluded from Linux CI.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Verify dependency tree integrity
        # npm ci enforces lockfile sync; npm ls adds an explicit check
        # for extraneous/missing packages and surfaces peer-dependency
        # drift with a clear CI step name.
        run: |
          echo "::group::Dependency tree"
          npm ls --depth=0 --omit=dev
          echo "::endgroup::"

      - name: Audit production dependencies only
        # Scans runtime dependencies only (excludes devDependencies) so
        # dev-only vulnerabilities don't mask production-critical issues.
        run: |
          echo "::group::Production dependency audit"
          npm audit --audit-level=high --omit=dev --no-fund
          echo "::endgroup::"

      - name: Full-spectrum vulnerability audit (informational)
        # Maximum-visibility: reports ALL known vulnerabilities (low+ severity)
        # in production dependencies. Non-blocking — surfaces early warnings
        # for vulnerabilities below the high threshold that blocks CI above.
        # Output is parsed and summarized by severity for quick daily triage:
        #   🚨 Critical → fix immediately  ⚠️ High → fix next patch
        #   🔍 Moderate → fix when convenient  📋 Low → track for remediation
        continue-on-error: true
        run: |
          echo "::group::Full production dependency audit (informational)"
          audit_json=$(npm audit --audit-level=low --omit=dev --no-fund --json 2>/dev/null || true)
          if [ -n "$audit_json" ] && [ "$audit_json" != "{}" ]; then
            echo "$audit_json" | node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const counts = (data.metadata && data.metadata.vulnerabilities) || {};
              const severities = ['critical', 'high', 'moderate', 'low'];
              const emojis = { critical: '🚨', high: '⚠️ ', moderate: '🔍', low: '📋' };
              let total = 0;
              for (const sev of severities) {
                const count = counts[sev] || 0;
                total += count;
                if (count > 0) {
                  console.log(emojis[sev] + ' ' + sev.charAt(0).toUpperCase() + sev.slice(1) + ': ' + count);
                }
              }
              console.log('');
              console.log('Total: ' + total);
              if (total === 0) console.log('✅ No known vulnerabilities in production dependencies');
            "
          else
            echo "✅ No vulnerabilities found in production dependencies"
          fi
          echo "::endgroup::"

      - name: Check for outdated dependencies
        # Flags packages behind their latest compatible version — newer
        # releases may contain security patches the lockfile hasn't picked up.
        # Uses --omit=dev to focus on production dependencies only.
        # Non-blocking: surfaces drift as a CI annotation, not a failure.
        run: |
          echo "::group::Outdated production dependencies"
          outdated=$(npm outdated --omit=dev --json 2>/dev/null || true)
          if [ -n "$outdated" ] && [ "$outdated" != "{}" ]; then
            echo "::warning::Outdated dependencies found — review for security patches:"
            node -e "const d=JSON.parse(process.argv[1]);Object.entries(d).forEach(([k,v])=>{console.warn('  '+k+': '+v.current+' → '+v.wanted+' (latest: '+v.latest+')')})" "$outdated"
          else
            echo "All production dependencies are up to date"
          fi
          echo "::endgroup::"

      - name: Check for packages with install scripts
        # Packages with preinstall/install/postinstall scripts execute
        # arbitrary code during npm install — a known supply-chain
        # attack vector. Optional deps (e.g. macOS-only fsevents) are
        # excluded since they don't affect Linux CI.
        run: |
          echo "::group::Checking for install scripts"
          node -e "
            const p = require('./package-lock.json');
            const pkgs = Object.entries(p.packages || {});
            const scriptKeys = ['hasInstallScript', 'hasPostinstallScript', 'hasPreinstallScript'];
            const scriptNames = { hasInstallScript: 'install', hasPostinstallScript: 'postinstall', hasPreinstallScript: 'preinstall' };
            const flagged = pkgs.filter(([_, v]) => {
              if (v.optional) return false;
              return scriptKeys.some(k => v[k]);
            });
            if (flagged.length) {
              console.error('Packages with install scripts (supply-chain risk):');
              flagged.forEach(([path, meta]) => {
                const names = scriptKeys.filter(k => meta[k]).map(k => scriptNames[k]).join(', ');
                const name = path.replace('node_modules/', '');
                console.error('  ' + name + ' (v' + (meta.version || '?') + ') triggers: ' + names);
              });
              process.exit(1);
            }
            console.log('No packages with install scripts found');
          "
          echo "::endgroup::"
