name: Tests
run-name: "Tests"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to run the suite against'
        required: false
        default: '22'

# Cancel any in-flight runs for the same ref when a new commit lands.
# Saves CI minutes on rapid-fire pushes (the analyzer iterates daily).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Minimal permissions — this job only reads the repo and runs
    # tests. No write access, no package publishing, no secrets other
    # than what GITHUB_TOKEN implicitly grants. Prevents a malicious
    # action from escalating privileges if a future action's supply
    # chain is compromised.
    permissions:
      contents: read

    steps:
      # SHA-pinned for supply-chain integrity — moving major-version
      # tags can silently change behavior or pull in compromised
      # revisions. The `comment:` field documents the version so a
      # human reviewing the diff can confirm the pinned SHA matches
      # the expected upstream release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: npm

      - name: Install dependencies (reproducible from committed lockfile)
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate JSON config files
        run: npm run validate:json

      - name: Parse-check all JS
        run: npm run syntax

      - name: "Unit tests (api/_safety.js core helpers)"
        run: npm run test:unit -- --test-name-pattern="^(json|asString|getIp|rateLimit|applyRateLimitHeaders|readCappedBody)"

      - name: "Unit tests (request-id, errLog, accessLog helpers)"
        run: npm run test:unit -- --test-name-pattern="(generateRequestId|sanitizeIncomingRequestId|attachRequestId|errLog|accessLog)"

      - name: "Unit tests (analyze schema validator)"
        run: npm run test:unit -- --test-name-pattern="safeParseAnalysisResult"

      - name: "Unit tests (chat schema validator)"
        run: npm run test:unit -- --test-name-pattern="safeParseChatResult"

      - name: "Unit tests (AI provider reachability probe)"
        run: npm run test:unit -- --test-name-pattern="(probeProvider|probeProviderCached|clearProbeCache)"

      - name: "Unit tests (analyze handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="analyze handler"

      - name: "Unit tests (chat handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="chat handler"

      - name: "Unit tests (health handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="health handler"

      - name: Browser smoke tests (Playwright)
        run: npm run test:smoke
        env:
          CI: 'true'

      - name: Integration tests (mock AI)
        run: npm run test:integration
        env:
          CI: 'true'

      - name: Summary
        if: always()
        run: >-
          echo "All checks completed. Status: ${{ job.status }}."
