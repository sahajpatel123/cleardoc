name: Tests
run-name: "Tests"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to run the suite against'
        required: false
        default: '22'
  schedule:
    - cron: '0 2 * * *'

# Default to read-only access for every job. Jobs that need more
# privileges override this locally (none currently do for Tests).
permissions:
  contents: read

# Cancel any in-flight runs for the same ref when a new commit lands.
# Saves CI minutes on rapid-fire pushes (the analyzer iterates daily).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Minimal permissions — this job only reads the repo and runs
    # tests. No write access, no package publishing, no secrets other
    # than what GITHUB_TOKEN implicitly grants. Prevents a malicious
    # action from escalating privileges if a future action's supply
    # chain is compromised.
    permissions:
      contents: read

    steps:
      # SHA-pinned for supply-chain integrity — moving major-version
      # tags can silently change behavior or pull in compromised
      # revisions. The `comment:` field documents the version so a
      # human reviewing the diff can confirm the pinned SHA matches
      # the expected upstream release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version || '22' }}
          cache: npm

      - name: Install dependencies (reproducible from committed lockfile)
        # --ignore-scripts blocks preinstall/install/postinstall lifecycle hooks
        # in dependencies — a common supply-chain attack vector.
        # Safe for this project: the only devDependency (playwright) installs
        # browsers separately via 'npx playwright install', and fsevents
        # (macOS-only, optional) is excluded from Linux CI.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Audit production dependencies for vulnerabilities (blocking)
        # Blocking gate scoped to runtime deps (--omit=dev) — the same policy
        # the Security workflow enforces. Dev-only vulnerabilities surface
        # through the advisory steps below instead of reddening Tests.
        run: npm audit --audit-level=high --omit=dev --no-fund

      - name: Audit dependencies for moderate vulnerabilities (advisory)
        # Non-blocking: surfaces moderate+ vulnerabilities early in the
        # development workflow. The security workflow hard-fails on
        # high+ in production scopes (--omit=dev).
        continue-on-error: true
        run: |
          echo "::group::Moderate vulnerability audit"
          npm audit --audit-level=moderate --no-fund || true
          echo "::endgroup::"

      - name: Check for outdated dependencies (advisory)
        # Non-blocking: surfaces stale packages that may carry unpatched
        # security fixes. --omit=dev focuses the advisory on production deps.
        # Structured output: current → wanted → latest for each package.
        continue-on-error: true
        run: |
          echo "::group::Outdated dependencies"
          outdated=$(npm outdated --omit=dev --json 2>/dev/null || true)
          if [ -n "$outdated" ] && [ "$outdated" != "{}" ]; then
            echo "::warning::Outdated production dependencies found — review for security patches"
            node -e "const d=JSON.parse(process.argv[1]);Object.entries(d).forEach(([k,v])=>console.log('  '+k+': '+v.current+' → '+v.wanted+' (latest: '+v.latest+')'))" "$outdated" || true
          else
            echo "All production dependencies are up to date"
          fi
          echo "::endgroup::"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate JSON config files
        run: npm run validate:json

      - name: Parse-check all JS
        run: npm run syntax

      - name: "Unit tests (api/_safety.js core helpers)"
        run: npm run test:unit -- --test-name-pattern="^(json|asString|getIp|rateLimit|applyRateLimitHeaders|readCappedBody)"

      - name: "Unit tests (request-id, errLog, accessLog helpers)"
        run: npm run test:unit -- --test-name-pattern="(generateRequestId|sanitizeIncomingRequestId|attachRequestId|errLog|accessLog)"

      - name: "Unit tests (analyze schema validator)"
        run: npm run test:unit -- --test-name-pattern="safeParseAnalysisResult"

      - name: "Unit tests (chat schema validator)"
        run: npm run test:unit -- --test-name-pattern="safeParseChatResult"

      - name: "Unit tests (AI provider reachability probe)"
        run: npm run test:unit -- --test-name-pattern="(probeProvider|probeProviderCached|clearProbeCache)"

      - name: "Unit tests (analyze handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="analyze handler"

      - name: "Unit tests (chat handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="chat handler"

      - name: "Unit tests (health handler error safety net)"
        run: npm run test:unit -- --test-name-pattern="health handler"

      - name: Browser smoke tests (Playwright)
        run: npm run test:smoke
        env:
          CI: 'true'

      - name: Integration tests (mock AI)
        run: npm run test:integration
        env:
          CI: 'true'

      - name: Summary
        if: always()
        run: >-
          echo "All checks completed. Status: ${{ job.status }}."
