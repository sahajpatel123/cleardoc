name: CodeQL Analysis
run-name: "CodeQL Analysis"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Concurrency: cancel in-flight runs when a new push lands.
# Prevents stale analysis jobs from running after newer commits.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Python removed — this repo currently has no Python source files.
        # Re-add to the matrix if Python code lands so it gets scanned too.
        language: [javascript]
    steps:
      # SHA-pinned for supply-chain integrity — version tags can silently change
      # behavior or pull in compromised revisions. The `comment:` field documents
      # the version so reviewers can verify the pinned SHA matches the expected upstream.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ${{ matrix.language }}
