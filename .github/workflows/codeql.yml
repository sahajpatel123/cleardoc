name: CodeQL Analysis
run-name: "CodeQL Analysis"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
      - 'test/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-concepts/**'
      - 'memory/**'
      - 'test/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to scan (default javascript)'
        required: false
        default: 'javascript'

# Default to read-only access. The analyze job below explicitly requests
# the security-events write it needs to upload CodeQL results.
permissions:
  contents: read

# Concurrency: cancel in-flight runs when a new push lands.
# Prevents stale analysis jobs from running after newer commits.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGUAGES: ${{ github.event.inputs.language || 'javascript' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
    steps:
      # SHA-pinned for supply-chain integrity — version tags can silently change
      # behavior or pull in compromised revisions. The `comment:` field documents
      # the version so reviewers can verify the pinned SHA matches the expected upstream.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ env.LANGUAGES }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: ${{ env.LANGUAGES }}
